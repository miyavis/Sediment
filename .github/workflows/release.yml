name: Build release assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Prepare release version
        run: node scripts/release-prepare.mjs ${{ github.ref_name }}

      - name: Build plugin
        run: npm run build

      - name: Run regression tests
        run: npm test

      - name: Verify release versions and files
        run: node scripts/verify-release.mjs ${{ github.ref_name }}

      - name: Package install folder
        run: cd dist && zip -r ../sediment-${{ github.ref_name }}.zip sediment

      - name: Generate release notes from CHANGELOG.md
        run: node scripts/latest-changelog.mjs ${{ github.ref_name }} > RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            sediment-*.zip
            main.js
            manifest.json
            styles.css
            mcp-server/index.mjs
